version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "3000:80"
    environment:
      # This URL is used by the browser to connect to the backend
      - API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=owensm1p
      - DB_NAME=community
      - SECRET_KEY=dev_secret_key
      - DEBUG=true
    # Wait for DB to be healthy, then start uvicorn
    command: /usr/local/bin/wait-for-it.sh db:3306 -- uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount public directory to persist uploads
      - ./public:/app/public

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=owensm1p
      - MYSQL_DATABASE=community
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Initialize database schema
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-powensm1p"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
